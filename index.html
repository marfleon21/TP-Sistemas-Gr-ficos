<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Template 3</title>
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				height: 100%;
				background-color: #444444;
				color: white;
				font-family: Arial, Helvetica, sans-serif;
			}

			#container3D {
				width: 100%;
				height: 100%;
			}
		</style>
	</head>
	<body>

		<div style="position: absolute; top: 15px; left: 15px; background: rgba(20, 20, 20, 0.8); color: white; padding: 15px; border-radius: 8px; font-family: sans-serif; z-index: 100;">
			<label for="sliderRiel">Posición en el Riel (C):</label><br>
			<input type="range" id="sliderRiel" min="0" max="1" step="0.005" value="0.5" style="width: 200px; margin-bottom: 15px;"><br>

			<label for="sliderExt">Extensión de la Grúa:</label><br>
			<input type="range" id="sliderExt" min="0" max="15" step="0.1" value="0" style="width: 200px;">
		</div>


		<div id="container3D"></div>
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
